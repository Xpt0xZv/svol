name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  supply-chain-hygiene:
    name: Supply-Chain & Hygiene Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" || -z "${BASE_SHA}" ]]; then
            echo "code_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! changed_files=$(git diff --name-only "${BASE_SHA}...HEAD" 2>/dev/null); then
            echo "code_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -z "${changed_files}" ]]; then
            echo "code_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          code_changed="false"
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            if [[ "${file}" =~ ^(src/|tests/|Cargo\.toml$|Cargo\.lock$|pyproject\.toml$|\.github/workflows/ci\.yml$) ]]; then
              code_changed="true"
              break
            fi
          done <<< "${changed_files}"
          echo "code_changed=${code_changed}" >> "${GITHUB_OUTPUT}"
          echo "Detected code_changed=${code_changed}"

      - name: Forbid build.rs anywhere in repository
        shell: bash
        run: |
          set -euo pipefail
          found=$(find . -name "build.rs" -not -path "*/target/*" -print)
          if [[ -n "${found}" ]]; then
            echo "::error::Forbidden build.rs detected in repository:"
            echo "${found}"
            exit 1
          fi
          echo "OK: No build.rs scripts found."

      - name: Verify version parity between Cargo.toml and pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          cargo_ver=$(python3 -c 'import tomllib, pathlib; d = tomllib.loads(pathlib.Path("Cargo.toml").read_text()); print(d["package"]["version"])')
          py_ver=$(python3 -c 'import tomllib, pathlib; d = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); print(d["project"]["version"])')
          echo "Cargo.toml version:     ${cargo_ver}"
          echo "pyproject.toml version: ${py_ver}"
          if [[ "${cargo_ver}" != "${py_ver}" ]]; then
            echo "::error::Version mismatch between Cargo.toml (${cargo_ver}) and pyproject.toml (${py_ver})"
            exit 1
          fi
          echo "OK: Version strings match (${cargo_ver})."

      - name: Install Rust toolchain
        if: steps.changes.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify zero external crates in dependency tree
        if: steps.changes.outputs.code_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tree_out=$(cargo tree --locked --edges normal,build,dev --prefix none)
          echo "${tree_out}"
          line_count=$(printf "%s\n" "${tree_out}" | wc -l | tr -d ' ')
          if [[ "${line_count}" -ne 1 ]] || ! printf "%s\n" "${tree_out}" | grep -Eq '^svol v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Expected only root package 'svol' in cargo tree, got:"
            echo "${tree_out}"
            exit 1
          fi
          echo "OK: Zero external dependencies verified."

      - name: Check formatting (cargo fmt)
        if: steps.changes.outputs.code_changed == 'true'
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (cargo clippy)
        if: steps.changes.outputs.code_changed == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0, LGPL-2.1, LGPL-3.0

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: supply-chain-hygiene
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: ${{ matrix.os != 'ubuntu-latest' && 'clippy' || '' }}

      - name: Run Clippy
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true' && matrix.os != 'ubuntu-latest'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit, integration, and doc tests
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true' && matrix.os == 'ubuntu-latest'
        run: cargo test --locked

      - name: Run unit, integration, and binary tests
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true' && matrix.os != 'ubuntu-latest'
        run: cargo test --locked --all-targets

  msrv:
    name: MSRV Check (Rust 1.79.0)
    needs: supply-chain-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.79.0 toolchain
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.79.0"

      - name: Check & test with MSRV 1.79.0
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        run: cargo test --locked --all-targets

  miri:
    name: Miri Undefined Behavior Sanitizer
    needs: supply-chain-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly toolchain with Miri
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: miri, rust-src

      - name: Run Miri Undefined Behavior Sanitizer
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
        run: cargo +nightly miri test --locked --lib --bins --test security_adversarial

  maturin-smoke:
    name: Maturin Wheel Smoke Test
    needs: supply-chain-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Build wheel via maturin
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --locked

      - name: Install wheel and smoke test binary
        if: needs.supply-chain-hygiene.outputs.code_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --no-deps dist/svol-*.whl
          .venv/bin/svol --version
          .venv/bin/svol --help > /dev/null
          formatted=$(printf '<root z="1" a="2"><child>ok</child></root>' | .venv/bin/svol fmt --sort-attributes)
          printf '%s\n' "${formatted}" | .venv/bin/svol check --sort-attributes
