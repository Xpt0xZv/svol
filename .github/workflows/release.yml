name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-release-gate:
    name: Pre-Release Supply-Chain & Version Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Verify zero build.rs, zero external dependencies, and tag-version parity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(find . -name 'build.rs' -not -path '*/target/*' -print)" ]]; then
            echo "::error::Forbidden build.rs detected"
            exit 1
          fi
          tree_out=$(cargo tree --locked --edges normal,build,dev --prefix none)
          if [[ "$(printf '%s\n' "${tree_out}" | wc -l | tr -d ' ')" -ne 1 ]]; then
            echo "::error::External dependencies detected: ${tree_out}"
            exit 1
          fi
          cargo_ver=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')
          py_ver=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          tag_ver="${GITHUB_REF_NAME#v}"
          if [[ "${cargo_ver}" != "${py_ver}" || "${cargo_ver}" != "${tag_ver}" ]]; then
            echo "::error::Version mismatch: tag=${tag_ver}, Cargo.toml=${cargo_ver}, pyproject.toml=${py_ver}"
            exit 1
          fi

  build-binaries:
    name: Build Release Binary (${{ matrix.target }})
    needs: verify-release-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Zig toolchain for Linux cross-compilation
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild for Linux cross-compilation
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-zigbuild

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cargo zigbuild --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          pkg_name="svol-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cp README.md LICENSE-MIT LICENSE-APACHE stage/
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/svol.exe" stage/
            (cd stage && 7z a -tzip "../dist/${pkg_name}.zip" svol.exe README.md LICENSE-MIT LICENSE-APACHE)
          else
            cp "target/${{ matrix.target }}/release/svol" stage/
            tar -C stage -czf "dist/${pkg_name}.tar.gz" svol README.md LICENSE-MIT LICENSE-APACHE
          fi
          rm -rf stage

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-wheels:
    name: Build Python Wheels (${{ matrix.target }})
    needs: verify-release-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_17"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2
          - target: x86_64-apple-darwin
            os: macos-latest
            manylinux: auto
          - target: aarch64-apple-darwin
            os: macos-latest
            manylinux: auto
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            manylinux: auto
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            manylinux: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheel with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --out dist-wheels --locked

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist-wheels/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build Python Source Distribution
    needs: verify-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sdist with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist-wheels

      - name: Upload sdist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-sdist
          path: dist-wheels/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Attest SLSA Provenance & Publish GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum svol-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Attest SLSA Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/svol-*
            release-assets/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-assets/svol-*
            release-assets/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher OIDC)
    needs: [build-wheels, build-sdist, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/svol
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  publish-crates-io:
    name: Publish to crates.io (Trusted Publisher OIDC)
    needs: [github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/svol
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
