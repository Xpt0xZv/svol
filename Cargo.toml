[package]
name = "svol"
version = "0.1.0"
edition = "2021"
rust-version = "1.79.0"
description = "Zero-dependency, single-pass streaming XML 1.0 (Fifth Edition) + Namespaces in XML 1.0 linter, formatter, and LSP server"
license = "MIT OR Apache-2.0"
exclude = ["fuzz", ".github", ".idea"]

[workspace]
exclude = ["fuzz"]

[[bin]]
name = "svol"
path = "src/main.rs"

[lib]
name = "svol"
path = "src/lib.rs"

[dependencies]
# Zero external dependencies (std only)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
